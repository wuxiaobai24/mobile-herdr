<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herdr Terminal</title><link rel="stylesheet" href="/terminal.css">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg, #1e1e2e);color:var(--text, #cdd6f4)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column;font-size:13px}
button{font:inherit;border:1px solid var(--line, #585b70);color:var(--muted, #bac2de);background:var(--surface, #313244);border-radius:8px;min-height:44px;padding:0 12px;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:background .14s,transform .14s}
button:hover{background:var(--hover, #45475a)}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--accent, #89b4fa);outline-offset:-2px}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:var(--hover, #45475a);color:var(--text, #cdd6f4);border-color:var(--line, #585b70)}
#toolbar{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line, #585b70);flex-shrink:0}#state{flex:1;min-width:0;font-size:12px;line-height:18px;color:var(--muted, #bac2de)}#toolbar button{border:0;background:transparent;padding:0 10px}#toolbar button[aria-pressed=true]{background:var(--hover, #45475a)}
#surface{position:relative;flex:1;min-height:0;overflow:hidden}#terminal{height:100%;padding:10px 6px 10px 12px;touch-action:none}.xterm{height:100%}.xterm .xterm-scrollable-element>.scrollbar>.slider{background:var(--line, #585b70)!important}
#history{height:100%;display:flex;flex-direction:column;background:var(--bg, #1e1e2e)}#history-tools{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line, #585b70);color:var(--muted, #bac2de);flex-shrink:0}#history-note{flex:1;line-height:18px;font-size:12px}#history-tools button{border:0;background:transparent;color:var(--accent, #89b4fa)}
#history-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;white-space:pre;margin:0;padding:14px 16px;font:var(--terminal-size, 13px)/1.7 "SFMono-Regular",Consolas,"Liberation Mono",monospace;tab-size:4;user-select:text;-webkit-user-select:text}
#latest{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--hover, #45475a);box-shadow:0 3px 16px #0006;color:var(--text, #cdd6f4);border-radius:24px}#latest:active{transform:translateX(-50%) scale(.97)}
#keys{display:flex;gap:8px;padding:6px 8px;border-top:1px solid var(--line, #585b70);flex-shrink:0;background:var(--sidebar, #181825)}#keys button{min-width:44px;padding:0 10px;flex-shrink:0}#key-scroll{--key-columns:4;display:grid;grid-auto-flow:column;grid-auto-columns:min(64px,calc((100% - (var(--key-columns) - 1)*4px)/var(--key-columns)));gap:4px;flex:1;min-width:44px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}#key-scroll button{scroll-snap-align:start;min-width:0;padding:0 4px}#key-actions{display:flex;gap:4px;flex-shrink:0;border-left:1px solid var(--line);padding-left:4px}#key-actions button{padding:0;width:44px;display:flex;align-items:center;justify-content:center}#keys [data-modifier][aria-pressed=true]{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
#direction-pad{position:absolute;right:10px;bottom:10px;width:204px;max-width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 6px 24px #0005;z-index:3;overflow:hidden;animation:controls-in .14s ease-out}#pad-header{display:flex;align-items:center}#pad-handle{flex:1;touch-action:none;cursor:move;padding:12px;color:var(--muted);font-size:12px;user-select:none}#close-pad{width:44px;border:0;background:transparent;font-size:20px}#pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 6px 6px}#pad-grid button{min-width:0;min-height:44px;padding:0 4px}#pad-grid button[data-arrow]{font-size:22px}
#paste-editor{position:absolute;inset:auto 8px 8px;max-height:100%;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 6px 24px #0005;z-index:4;animation:controls-in .14s ease-out}#paste-heading{display:flex;align-items:center;justify-content:space-between}#paste-heading button{border:0;background:transparent;width:44px;font-size:20px}#paste-text{width:100%;min-height:60px;height:100px;max-height:30vh;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font:16px/1.5 monospace;padding:8px}#paste-footer{display:flex;align-items:center;gap:8px}#paste-note{flex:1;min-width:0;font-size:12px;line-height:18px;color:var(--muted)}#send-paste{background:var(--accent);color:var(--accentInk);border:0}#send-paste:disabled{background:var(--hover);color:var(--muted)}@keyframes controls-in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
#history-find{display:flex;flex-direction:column;gap:2px;padding:4px 8px;flex-shrink:0;border-bottom:1px solid var(--line)}.history-find-row{display:flex;gap:4px;align-items:center;width:100%}#history-query{width:0;min-width:0;flex:1;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;font:16px system-ui;padding:10px}#copy-history{margin-left:auto}#history-find button{min-width:44px;padding:0 8px;border:0;background:transparent}#match-count{font-size:12px;color:var(--muted)}mark{background:var(--accentSurface);color:var(--text);outline:1px solid var(--accent)}mark[data-active=true]{background:var(--accent);color:var(--accentInk)}[hidden]{display:none!important}::selection{background:color-mix(in srgb, var(--accent) 35%, transparent)}::-webkit-scrollbar{width:7px;height:6px}::-webkit-scrollbar-thumb{background:var(--line, #585b70);border-radius:4px}
.xterm .xterm-helper-textarea{font-size:16px!important}
@media(max-width:359px){#key-scroll{--key-columns:3}}@media(min-width:600px){#key-scroll{--key-columns:8}}
@media(max-height:350px){#toolbar{padding-block:0}#keys{padding-block:4px}#terminal{padding-block:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="toolbar"><span id="state" role="status">连接原始终端…</span><button id="show-history" aria-pressed="false">历史</button><button id="reconnect" aria-label="重新连接终端">重连</button></div>
<div id="surface">
<div id="terminal" aria-label="实时终端"></div>
<section id="history" aria-label="终端历史" hidden><div id="history-tools"><span id="history-note" role="status">读取历史…</span><button id="refresh-history">刷新</button><button id="close-history">返回终端</button></div><div id="history-find"><div class="history-find-row"><input id="history-query" type="search" aria-label="查找终端历史" placeholder="查找历史"><span id="match-count" role="status">0</span><button id="previous-match" aria-label="上一个终端匹配">↑</button><button id="next-match" aria-label="下一个终端匹配">↓</button></div><div class="history-find-row"><button id="history-top" aria-label="历史顶部">顶部</button><button id="history-bottom" aria-label="历史底部">底部</button><button id="copy-history" aria-label="复制终端历史">复制</button></div></div><pre id="history-content" tabindex="0" aria-label="终端历史内容"></pre></section>
<button id="latest" hidden>回到实时</button>
<section id="direction-pad" aria-label="终端方向面板" hidden><div id="pad-header"><div id="pad-handle" aria-label="拖动方向面板">方向键 · 拖动移动</div><button id="close-pad" aria-label="关闭方向面板">×</button></div><div id="pad-grid"><button data-key="\u001b">Esc</button><button data-key="\u001b[A" data-arrow aria-label="终端向上">↑</button><button data-key="\u0009">Tab</button><button data-key="\u001b[D" data-arrow aria-label="终端向左">←</button><button data-key="\u000d">Enter</button><button data-key="\u001b[C" data-arrow aria-label="终端向右">→</button><button data-key="\u007f" aria-label="终端退格">⌫</button><button data-key="\u001b[B" data-arrow aria-label="终端向下">↓</button><button data-key="\u001b[3~" aria-label="终端删除">Del</button></div></section>
<section id="paste-editor" role="dialog" aria-label="粘贴到终端前预览" hidden><div id="paste-heading"><span>粘贴到当前终端</span><button id="close-paste" aria-label="关闭终端粘贴">×</button></div><textarea id="paste-text" aria-label="待粘贴的终端内容" maxlength="32000" spellcheck="false" placeholder="在这里粘贴或编辑内容…"></textarea><div id="paste-footer"><span id="paste-note" role="status">检查内容后粘贴；换行可能执行命令。</span><button id="send-paste">粘贴到终端</button></div></section>
</div>
<div id="keys"><div id="key-scroll" aria-label="终端快捷键，可左右滑动"><button data-key="\u001b">Esc</button><button data-modifier="ctrl" aria-label="一次性 Ctrl" aria-pressed="false">Ctrl</button><button data-modifier="alt" aria-label="一次性 Alt" aria-pressed="false">Alt</button><button data-key="\u0003">Ctrl C</button><button data-key="\u0009">Tab</button><button data-key="\u000d">Enter</button></div><div id="key-actions"><button id="open-paste" aria-label="预览终端粘贴" title="粘贴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="16" x="7" y="5" rx="2"/><path d="M7 19H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10"/></svg></button><button id="toggle-pad" aria-label="打开方向面板" aria-expanded="false" aria-controls="direction-pad" title="方向键"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18m-6-6-3-3-3 3m6 12-3 3-3-3M6 9l-3 3 3 3m12-6 3 3-3 3"/></svg></button><button id="keyboard" aria-label="打开终端键盘" title="键盘"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M10 13h.01M14 13h.01M18 13h.01M7 16h10"/></svg></button></div></div>
<script type="module" src="/terminal.js"></script>
</body></html>
