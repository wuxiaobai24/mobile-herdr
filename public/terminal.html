<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Herdr Terminal</title><link rel="stylesheet" href="/terminal.css"><style>
html,body{height:100%;margin:0;background:#101415;color:#a6b4af;font:13px system-ui}body{display:flex;flex-direction:column}#state{padding:10px 14px;border-bottom:1px solid #2a3434;min-height:18px}#terminal{flex:1;min-height:0;padding:8px}#keys{display:flex;gap:7px;padding:9px;border-top:1px solid #2a3434;overflow:auto}button{border:1px solid #34413d;color:#edf2ef;background:#1b2223;border-radius:6px;padding:10px 13px;white-space:nowrap;cursor:pointer;touch-action:manipulation}button:active{background:#34413d}button:disabled{opacity:.4}.xterm{height:100%}
</style></head><body><div id="state">连接原始终端…</div><div id="terminal"></div><div id="keys"><button data-key="\u001b">Esc</button><button data-key="\u0003">Ctrl C</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u0009">Tab</button><button data-key="\u000d">Enter</button><button id="reconnect">重连</button></div><script type="module" src="/terminal.js"></script></body></html>
